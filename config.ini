; ==============================================================================
; AION 2 BOT - ARQUIVO DE CONFIGURAÇÃO (CONFIG.INI)
; Modifique os valores abaixo sem precisar recompilar o bot!
; ==============================================================================

[Combate]
; Tempo de recarga (cooldown) da Skill E em milissegundos (padrão: 2000ms = 2s)
SkillE_CooldownMs=2000

; Tempo de recarga do Botão Direito do Mouse (RMB) em milissegundos (padrão: 1400ms = 1.4s)
RMB_CooldownMs=1400

; Auto-Cura: 1 = Ativada por padrão, 0 = Desativada (pode alternar no jogo via F6)
AutoHeal=1

; Intervalo de disparo da Auto-Cura em milissegundos (padrão: 3500ms = 3.5s)
Heal_CooldownMs=3500

; Auto-Loot: 1 = Coleta automática ao derrotar mob, 0 = Desativada (alterna via F7)
AutoLoot=1

; Quantidade de toques da tecla de loot para garantir a coleta (padrão: 2)
LootPressCount=2

; Duração inicial do avanço com 'W' em milissegundos ao travar o mob (padrão: 1400ms)
ApproachDurationMs=1400

[Teclas]
; Tecla de Auto-Cura (padrão: Q)
KeyHeal=Q

; Tecla de Skill de Dano (padrão: E)
KeySkillE=E

; Tecla de Coleta / Loot (padrão: F)
KeyLoot=F

[Overlay]
; Proteção de Janela: 1 = Funciona só no Aion 2, 0 = Modo Livre (alterna via F9)
WindowGuard=1

; Posição X e Y do HUD na tela (-1 = canto inferior direito automático)
PosX=-1
PosY=-1
